<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>库街区账号管家</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="bg-blob bg-blob-a"></span>
  <span class="bg-blob bg-blob-b"></span>
  <span class="bg-grid"></span>
</div>

<main class="page">

  <header class="head">
    <h1>账号管家</h1>
    <p class="head-sub" id="headSub">库街区每日自动签到</p>
  </header>

  <!-- 自动签到设置 -->
  <section class="card settings-card">
    <div class="setting-row">
      <div class="setting-label">
        <span class="setting-title">每日自动签到</span>
        <span class="setting-desc" id="nextRun">—</span>
      </div>
      <button class="switch" id="swAuto" role="switch" aria-checked="false" aria-label="每日自动签到">
        <span class="switch-knob"></span>
      </button>
    </div>

    <div class="setting-row">
      <div class="setting-label">
        <span class="setting-title">签到时间</span>
        <span class="setting-desc">每天到点自动执行</span>
      </div>
      <input class="time-input" id="signTime" type="time" value="08:30" aria-label="签到时间">
    </div>

    <div class="setting-row">
      <div class="setting-label">
        <span class="setting-title">自动补签</span>
        <span class="setting-desc">漏签的按可补次数补上</span>
      </div>
      <button class="switch" id="swReplenish" role="switch" aria-checked="true" aria-label="自动补签">
        <span class="switch-knob"></span>
      </button>
    </div>
  </section>

  <!-- 账号列表 -->
  <div class="list-head">
    <h2>账号 <span class="count" id="accCount">0</span></h2>
    <button class="link-btn" id="btnSignAll" type="button">全部签到</button>
  </div>

  <section class="accounts" id="accounts" aria-live="polite"></section>

  <section class="empty" id="empty" hidden>
    <p class="empty-title">还没有账号</p>
    <p class="empty-desc">添加账号后，每次登录都会自动签到一次，<br>之后按上面的时间每天自动签到。</p>
  </section>

  <button class="btn primary add-btn" id="btnAdd" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span class="btn-text">添加账号</span>
  </button>

</main>

<!-- ============================================================
     添加账号弹窗 —— 复用原登录界面
     ============================================================ -->
<div class="modal-backdrop" id="loginBackdrop" hidden></div>
<div class="modal-wrap" id="loginWrap" hidden>
<div class="modal" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">

  <div class="modal-body">
    <h2 id="loginTitle">登录库街区</h2>
    <p class="modal-note">添加后会立即签到一次。</p>

    <form class="form" id="form" novalidate>
      <div class="field">
        <label for="mobile">手机号</label>
        <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel"
               maxlength="11" placeholder="11 位手机号">
      </div>

      <button class="btn primary" id="btnSend" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-text">获取验证码</span>
      </button>

      <div class="field">
        <label for="code">验证码</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
               maxlength="8" placeholder="短信中的 6 位数字">
      </div>

      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <div class="modal-actions">
    <button class="btn primary" id="btnLogin" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn-text">登录并添加</span>
    </button>
    <button class="btn secondary" id="btnLoginClose" type="button">取消</button>
  </div>

</div>
</div>

<!-- ============================================================
     签到日志弹窗
     ============================================================ -->
<div class="log-backdrop" id="logBackdrop" hidden></div>
<div class="log-wrap" id="logWrap" hidden>
<div class="log-modal" id="logModal" role="dialog" aria-modal="true" aria-labelledby="logTitle">

  <div class="log-head">
    <h2 id="logTitle">签到日志</h2>
    <p class="log-sub" id="logSub"></p>
  </div>

  <div class="log-body" id="logBody"></div>

  <div class="log-actions">
    <button class="btn secondary" id="btnLogClose" type="button">关闭</button>
  </div>

</div>
</div>

<!-- 手动滑块兜底 -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet-wrap" id="sheetWrap" hidden>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

  <div class="sheet-body">
    <h2 id="sheetTitle">请完成滑块验证</h2>
    <p class="sheet-note">自动验证未通过。拖动下方滑块，让拼图对齐缺口。</p>

    <div class="captcha">
      <div class="captcha-canvas" id="captchaCanvas">
        <img class="captcha-bg" id="captchaBg" alt="">
        <img class="captcha-piece" id="captchaPiece" alt="">
      </div>

      <div class="slider" id="slider">
        <div class="slider-track" id="sliderTrack"></div>
        <span class="slider-hint" id="sliderHint">向右拖动</span>
        <div class="slider-thumb" id="sliderThumb" role="slider" tabindex="0"
             aria-label="滑块" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </div>
      </div>
    </div>

    <p class="msg" id="sheetMsg" role="status" aria-live="polite"></p>
  </div>

  <div class="sheet-actions">
    <button class="btn primary" id="btnRetryAuto" type="button">再试一次自动验证</button>
    <button class="btn secondary" id="btnSheetClose" type="button">取消</button>
  </div>

</div>
</div>

<!-- 通知 -->
<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="toast-check" d="M4 12.5 9.5 18 20 6.5"/>
  </svg>
  <span class="toast-text" id="toastText"></span>
</div>

<script src="lib/anime.v4.min.js"></script>
<script src="app.js"></script>
</body>
</html>
